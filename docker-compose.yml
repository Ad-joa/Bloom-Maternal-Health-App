version: '3.8'

services:
  backend:
    build: 
      context: ./backend-node
      dockerfile: Dockerfile
    image: bloom-backend:latest
    container_name: bloom_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/auth/login"]
      interval: 30s
      timeout: 10s
      retries: 3
